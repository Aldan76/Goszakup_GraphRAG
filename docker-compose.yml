version: '3.8'

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.14-community
    container_name: goszakup-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    networks:
      - goszakup-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # GraphRAG Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goszakup-bot
    environment:
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS}

      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-gpt-3.5-turbo}

      # Application
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      MAX_RETRIEVAL_RESULTS: ${MAX_RETRIEVAL_RESULTS:-5}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}

      # Data paths
      RAW_DATA_PATH: ${RAW_DATA_PATH:-./data/raw}
      PROCESSED_DATA_PATH: ${PROCESSED_DATA_PATH:-./data/processed}

    depends_on:
      neo4j:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    networks:
      - goszakup-network

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  goszakup-network:
    driver: bridge
